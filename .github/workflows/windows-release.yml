name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Verify editor regressions
        run: npm test
      - name: Set up Rust
        run: rustup default stable
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-2022-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/src/**', 'src-tauri/tauri.conf.json') }}
          restore-keys: windows-2022-rust-
      - name: Prepare installer helpers
        run: node scripts/prepare-bundler-tools.mjs
      - name: Build Windows app and installer
        id: installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          if (Test-Path -LiteralPath $bundleDir -PathType Container) {
            # The Rust cache may also contain a previous installer and signature.
            $bundlePattern = "_$([regex]::Escape($version))_.*-setup\.exe(\.sig)?$"
            Get-ChildItem -LiteralPath $bundleDir -File | Where-Object { $_.Name -match $bundlePattern } |
              ForEach-Object { Remove-Item -LiteralPath $_.FullName -ErrorAction Stop }
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri:build -- --bundles nsis -- --locked
            if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
            'signed=true' >> $env:GITHUB_OUTPUT
          } else {
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii updater-local-signing.json
            npm run tauri:build -- --config updater-local-signing.json --bundles nsis -- --locked
            if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
            'signed=false' >> $env:GITHUB_OUTPUT
          }
      - name: Verify native file I/O
        working-directory: src-tauri
        run: cargo test --release --locked
      - name: Smoke-test the installed application runtime
        run: node scripts/desktop-smoke.mjs src-tauri/target/release/recto-studio.exe
      - name: Package downloadable files
        shell: pwsh
        env:
          SIGNED_BUILD: ${{ steps.installer.outputs.signed }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-artifacts,release-artifacts/portable -Force | Out-Null
          Copy-Item src-tauri/target/release/recto-studio.exe "release-artifacts/portable/Recto Studio.exe"
          Copy-Item LICENSE release-artifacts/portable/LICENSE.txt
          Copy-Item DESKTOP.md release-artifacts/portable/README.txt
          Compress-Archive -Path release-artifacts/portable/* -DestinationPath "release-artifacts/Recto-Studio-$version-Windows-x64-portable.zip"
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Where-Object { $_.Name -match "_$([regex]::Escape($version))_.*-setup\.exe$" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer for version $version; found $($installers.Count)." }
          $installer = $installers[0]
          $publishedInstaller = "release-artifacts/Recto-Studio-$version-Windows-x64-setup.exe"
          Copy-Item $installer.FullName $publishedInstaller
          $signature = "$($installer.FullName).sig"
          if ($env:SIGNED_BUILD -eq 'true') {
            if (!(Test-Path -LiteralPath $signature -PathType Leaf)) { throw 'Signed build did not produce an installer signature.' }
            $publishedSignature = "$publishedInstaller.sig"
            Copy-Item $signature $publishedSignature
            node scripts/updater-manifest.mjs $publishedSignature
            if ($LASTEXITCODE -ne 0) { throw 'Could not create updater manifest.' }
          } else {
            if (Test-Path -LiteralPath $signature) { throw 'Unsigned build unexpectedly produced an installer signature.' }
            Write-Output 'Draft requires local installer signing and latest.json before publication.'
          }
          $hashes = Get-ChildItem release-artifacts -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $hashes | Set-Content -Encoding ascii release-artifacts/SHA256SUMS.txt
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Create draft release
        shell: pwsh
        env:
          SIGNED_BUILD: ${{ steps.installer.outputs.signed }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "Recto Studio $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
            $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets
            if ($LASTEXITCODE -ne 0) { throw 'Could not verify the new draft release.' }
          }
          $release = $releaseJson | ConvertFrom-Json
          if (!$release.isDraft) { throw "Release $tag is already public. Bump the version before uploading a new Windows build." }
          if ($env:SIGNED_BUILD -ne 'true' -and ($release.assets.name -contains 'latest.json' -or
              $release.assets.name -contains "Recto-Studio-$env:RELEASE_VERSION-Windows-x64-setup.exe.sig")) {
            throw 'This draft already has signed updater files. Keep the existing installer or rebuild with its signing key.'
          }
          $assets = Get-ChildItem release-artifacts -File | ForEach-Object { $_.FullName }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            test-results/desktop/
            src-tauri/Cargo.lock
            src-tauri/target/release/recto-studio.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: ignore
      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
