name: Build Linux release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          rustup default stable
      - run: npm ci
      - name: Cache native build dependencies
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tauri
            src-tauri/target
          key: linux-22-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/src/**') }}
          restore-keys: linux-22-rust-
      - run: npm audit --audit-level=moderate
      - run: npm test -- --maxWorkers=2
      - name: Prepare AppImage helpers
        run: node scripts/prepare-bundler-tools.mjs
      - name: Build Linux packages
        run: node scripts/build-linux.mjs 2>&1 | tee linux-build.log
      - name: Test native file operations
        working-directory: src-tauri
        run: cargo test --locked
      - name: Upload Linux packages to draft release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb "release-artifacts/Recto-Studio-$version-Linux-x64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-artifacts/Recto-Studio-$version-Linux-x64.AppImage"
          (cd release-artifacts && sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt)
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY"; then
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Recto Studio $version" --notes-file RELEASE_NOTES.md || gh release view "v$version" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "v$version" release-artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Retain packages for manual testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recto-linux-x64-test-packages
          if-no-files-found: error
          path: |
            linux-build.log
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Retain native cache after packaging failures
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tauri
            src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
