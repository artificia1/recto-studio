name: Deploy Studio to GitHub Pages

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Run regression tests
        run: npm test
      - name: Set up independent export validator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication files
        run: |
          python -m pip install pypdf==6.10.0
          python scripts/validate-exports.py
      - name: Build Production Bundle
        run: npm run build
      - name: Check startup bundle budget
        run: npm run analyze:bundle
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser workflows
        run: |
          npm run test:e2e:typecheck
          npx playwright test
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: './dist'
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
