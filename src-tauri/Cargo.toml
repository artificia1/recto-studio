[package]
name = "recto-studio"
version = "1.1.0"
description = "Recto Autonomous Desktop Publishing Studio"
authors = ["Abhinav <artificia1@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/artificia1/recto-studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
