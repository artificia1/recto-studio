[package]
name = "recto-studio"
version = "1.2.4"
description = "Recto Studio desktop publishing application"
authors = ["Abhinav <artificia1@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/artificia1/recto-studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri-plugin-updater = "2"
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
