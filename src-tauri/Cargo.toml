[package]
name = "papercut"
version = "0.1.0"
description = "Papercut Autonomous Desktop Publishing Studio"
authors = ["Papercut Studio Team"]
license = "MIT"
repository = "https://github.com/papercut/papercut"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
