[package]
name = "recto-native"
version = "1.5.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "recto_shaper"
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustybuzz = "=0.20.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
